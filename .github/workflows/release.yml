name: Release

on:
  push:
    branches:
      - main
  # Manually build and upload packages for an existing release tag
  # (e.g. to backfill assets for a release whose build failed).
  # Accepts either the bare version (0.7.0) or the full tag
  # (gemini-desktop-v0.7.0).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to build for (e.g. 0.7.0 or gemini-desktop-v0.7.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-amd64:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # Accept both "0.7.0" and "gemini-desktop-v0.7.0"
            case "$tag" in
              *-v[0-9]*) ;;
              v[0-9]*)   tag="gemini-desktop-$tag" ;;
              [0-9]*)    tag="gemini-desktop-v$tag" ;;
            esac
          else
            tag="$RELEASE_TAG"
          fi
          echo "Resolved release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build DEB and Snap packages
        run: npm run build:all

      - name: Upload release assets (DEB & Snap, amd64)
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            dist/*.deb dist/*.snap \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-arm64:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # Accept both "0.7.0" and "gemini-desktop-v0.7.0"
            case "$tag" in
              *-v[0-9]*) ;;
              v[0-9]*)   tag="gemini-desktop-$tag" ;;
              [0-9]*)    tag="gemini-desktop-v$tag" ;;
            esac
          else
            tag="$RELEASE_TAG"
          fi
          echo "Resolved release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only the .deb is built for arm64. electron-builder has no prebuilt snap
      # template for arm64, so it would fall back to a legacy core20 snap built
      # by the snapcraft CLI — which is not available/supported on the Ubuntu
      # 24.04 runner. arm64 users install the .deb.
      - name: Build DEB package
        run: npm run build:deb

      - name: Upload release assets (DEB, arm64)
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --clobber
